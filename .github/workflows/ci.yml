name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Verify build toolchain
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/talaria-buildinfo.test" ./internal/netdial
          go version -m "$RUNNER_TEMP/talaria-buildinfo.test" | grep -F "$(go env GOVERSION)"

      - name: Vet
        run: go vet ./...

      # The race detector is the point of this job: the data path is concurrent
      # and several past defects were only visible under -race.
      - name: Test
        run: go test -race -count=1 -timeout 15m ./...

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross-build:
    name: cross-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: 0 }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, cgo: 0 }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: 0 }
          - { runner: ubuntu-latest, goos: android, goarch: arm64, cgo: 0 }
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: 0 }
          # iOS links against the platform toolchain, so it needs cgo and a
          # macOS runner. Only the library packages are built; the commands are
          # not an iOS deliverable.
          - { runner: macos-latest, goos: ios, goarch: arm64, cgo: 1 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          if [ "$GOOS" = "ios" ]; then
            go build ./client/... ./protocol/... ./transport/... ./server/... ./internal/...
          else
            go build ./...
          fi

      # vet is GOOS-sensitive, so platform-specific files only get checked here.
      - name: Vet ${{ matrix.goos }}/${{ matrix.goarch }}
        if: matrix.goos != 'ios'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go vet ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
